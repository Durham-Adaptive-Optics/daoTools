name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      SYSDEPS_FILE: "./daoTools/.github/workflows/sys-deps.txt"
      WAF_SRC: "https://waf.io/waf-2.0.24"

    steps:
      #  -------------------------------------------------------------------------------------- #
      - name: Configure dao Environment (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "DAOROOT=$HOME/DAOROOT" >> $GITHUB_ENV
          echo "DAODATA=$HOME/DAODATA" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}$HOME/DAOROOT/lib:$HOME/DAOROOT/lib64" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/bin:$HOME/DAOROOT/bin" >> $GITHUB_ENV
          echo "PYTHONPATH=${PYTHONPATH:+$PYTHONPATH:}$HOME/DAOROOT/python" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:+$PKG_CONFIG_PATH:}$HOME/DAOROOT/lib/pkgconfig" >> $GITHUB_ENV

      #  -------------------------------------------------------------------------------------- #
      - name: Remove Azure CLI apt repo
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/azure-cli.list
      #  -------------------------------------------------------------------------------------- #

      #  -------------------------------------------------------------------------------------- #
      - name: Create dao Enviroment (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir $DAOROOT
          mkdir $DAODATA
          mkdir $HOME/bin

      #  -------------------------------------------------------------------------------------- #

      #  -------------------------------------------------------------------------------------- #
      - name: Checkout daoBase
        uses: actions/checkout@v4
        with:
          repository: Durham-Adaptive-Optics/daoBase
          path: daoBase
          token: ${{ secrets.CI_CLONE_ACCESS_TOKEN }}
      #  -------------------------------------------------------------------------------------- #

      #  -------------------------------------------------------------------------------------- #
      - name: Checkout daoTools
        uses: actions/checkout@v4
        with:
          path: daoTools
      #  -------------------------------------------------------------------------------------- #

      #  -------------------------------------------------------------------------------------- #
      - name: Cache System Dependencies (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-${{ hashFiles(env.SYSDEPS_FILE) }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          xargs -a ${{env.SYSDEPS_FILE}} sudo apt install -y
      #  -------------------------------------------------------------------------------------- #

      #  -------------------------------------------------------------------------------------- #
      - name: Install Python (v3.10)
        uses: actions/setup-python@v4
        with: 
          python-version: "3.10"
          cache: 'pip' # Enables automatic package caching.
          cache-dependency-path: daoTools/pyrequirements.txt

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r ./daoTools/pyrequirements.txt
      #  -------------------------------------------------------------------------------------- #

      #  -------------------------------------------------------------------------------------- #
      - name: Cache WAF Executable (Linux)
        id: waf-cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ~/bin/waf
          key: ${{ runner.os }}-WAF-${{env.WAF_SRC}}

      - name: Install WAF Executable (Linux) 
        if: runner.os == 'Linux' && steps.waf-cache.outputs.cache-hit != 'true'
        run: |
          curl -o ~/bin/waf ${{env.WAF_SRC}}
          chmod +x ~/bin/waf
      #  -------------------------------------------------------------------------------------- #

      #  -------------------------------------------------------------------------------------- #
      - name: Build daoBase
        run: |
          cd ./daoBase 
          waf configure --prefix=$DAOROOT
          waf -v
          waf install
      #  -------------------------------------------------------------------------------------- #

      #  -------------------------------------------------------------------------------------- #
      - name: Build daoTools
        run: |
          cd ./daoTools
          waf configure --prefix=$DAOROOT
          waf -v
          waf install
      #  -------------------------------------------------------------------------------------- #

      #  -------------------------------------------------------------------------------------- #
      - name: Test Suite
        run: |
          cd ./daoTools/tests
          pytest -v -s
      #  -------------------------------------------------------------------------------------- #
