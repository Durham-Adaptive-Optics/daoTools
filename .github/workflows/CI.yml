name: daoTools 

on:
  push:
    branches:
      - CI-Workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout daoTools
        uses: actions/checkout@v4
        with:
          path: daoTools

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y libtool pkg-config build-essential autoconf automake \
            libssl-dev libncurses5-dev libncursesw5-dev redis libgtest-dev libgsl-dev libzmq3-dev \
            protobuf-compiler numactl libnuma-dev

      - name: Install WAF Build System
        run: |
          mkdir -p ~/.local/bin
          curl -o ~/.local/bin/waf https://waf.io/waf-2.0.24
          chmod +x ~/.local/bin/waf
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python (v3.10)
        uses: actions/setup-python@v4
        with: 
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install posix_ipc zmq protobuf==3.20.0 astropy python-statemachine statemachine redis sphinx screeninfo

      - name: Setup Dao Environment
        run: 
          export DAOROOT=$HOME/DAOROOT
          export DAODATA=$HOME/DAODATA
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$DAOROOT/lib:$DAOROOT/lib64
          export PATH=$PATH:$HOME/bin:$HOME/DAOROOT/bin
          export PYTHONPATH=$PYTHONPATH:$DAOROOT/python
          export PKG_CONFIG_PATH=$PKG_CONFIG_PATH:$DAOROOT/lib/pkgconfig
          mkdir $DAOROOT

      - name: Checkout daoBase
        uses: actions/checkout@v4
        with:
          repository: Durham-Adaptive-Optics/daoBase
          path: daoBase
          token: ${{ secrets.CI_CLONE_ACCESS_TOKEN }}

      - name: Build daoBase
        run: |
          cd ./daoBase 
          waf configure --prefix=$DAOROOT
          waf
      - name: Build daoTools
        run: |
          ls
          cd ./daoTools
          waf configure --prefix=$DAOROOT
          waf
