name: Build and Test Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

strategy:
  runs-on: ubuntu-latest
  fail-fast: false
  steps:
    - name: Install System Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y libtool pkg-config build-essential autoconf automake \
          libssl-dev libncurses5-dev libncursesw5-dev redis libgtest-dev libgsl-dev libzmq3-dev \
          protobuf-compiler numactl libnuma-dev

    - name: Install WAF Build System
      run: |
        curl -o waf https://waf.io/waf-2.0.24
        chmod +x waf

    - name: Install Python (v3.10)
      uses: actions/setup-python@v4
      with: 
        python-version: "3.10"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install posix_ipc zmq protobuf==3.20.0 astropy python-statemachine statemachine redis sphinx screeninfo

    - name: Checkout daoTools
      uses: actions/checkout@v5.6

    - name: Build daoTools
      run: |
        export DAOROOT=/home/runner/DAOROOT
        mkdir $DAOROOT
        waf configure --prefix=$DAOROOT
        waf -v
        waf install